# Renovate bumps AQUA_INSTALLER_VERSION in ./limen-install but cannot
# recompute its sha256 companion; this pushes the fix-up onto renovate/**
# (the canonical update-aqua-checksum is limen-pinned, byte-for-byte, and
# cannot carry it). Same construction as that workflow: `push:` on the
# branch prefix, never pull_request_target; no credential kept by the
# checkout; the commit made through createCommitOnBranch with a one-run App
# token so GitHub signs it — the `limen:main` ruleset requires signatures,
# and an unsigned git push made every aqua-installer bump PR unmergeable.
# No loop: the no-change exit ends recursion. Both fix-up workflows fire on
# renovate/** with disjoint writers; a grouped branch bumping both can
# collide — the loser fails, and Renovate's next rebase retriggers it.
name: update-installer-checksum

on:
  push:
    branches: ["renovate/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link

      - name: Recompute the aqua-installer sha256 for the pinned version
        run: |
          version="$(sed -n 's/^readonly AQUA_INSTALLER_VERSION="\(.*\)"$/\1/p' limen-install)"
          [ -n "$version" ] || { echo "could not extract AQUA_INSTALLER_VERSION from ./limen-install" >&2; exit 1; }
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "${tmp}/aqua-installer" \
            "https://raw.githubusercontent.com/aquaproj/aqua-installer/${version}/aqua-installer"
          sha="$(sha256sum "${tmp}/aqua-installer" | cut -d' ' -f1)"
          rm -rf "${tmp}"
          sed -i "s/^readonly AQUA_INSTALLER_SHA256=\".*\"$/readonly AQUA_INSTALLER_SHA256=\"${sha}\"/" limen-install

      - name: Mint a push token, if the App is configured
        # As in the canonical workflow: the minted token lives one hour and is
        # scoped to this repository; the private key only ever mints. Guarded
        # on the variable so a repo without the App falls through to the
        # token chain below.
        if: vars.UPDATE_AQUA_CHECKSUM_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATE_AQUA_CHECKSUM_APP_ID }}
          private-key: ${{ secrets.UPDATE_AQUA_CHECKSUM_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit the update through the API, if any
        env:
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ steps.app-token.outputs.token || secrets.UPDATE_AQUA_CHECKSUM_TOKEN || github.token }}
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "installer checksum already in sync"; exit 0; }
          # One file, one writer: the recompute step above only ever edits
          # ./limen-install, so the payload is that file. createCommitOnBranch
          # carries no file mode, and the script's executable bit survives
          # because the mutation only replaces the blob of an existing path.
          # Signed-off-by: `just do lint commits` enforces DCO on the PR range,
          # bot commits included.
          payload="$(jq -n \
            --arg query 'mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg head "$(git rev-parse HEAD)" \
            --arg contents "$(base64 -w0 limen-install)" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $head,
              message: {
                headline: "chore: recompute the aqua-installer checksum",
                body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
              },
              fileChanges: {additions: [{path: "limen-install", contents: $contents}]}}}}')"
          # GraphQL reports failure in-body over HTTP 200, so success is the
          # presence of the new commit oid, never the HTTP status.
          # No --retry and no -L: a mutation guarded by expectedHeadOid, and a
          # redirect must never replay a POST (same as the canonical workflow).
          response="$(curl --proto '=https' --tlsv1.2 -fsS -X POST -H "Authorization: bearer ${TOKEN}" \
            -d "${payload}" https://api.github.com/graphql)"
          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"${response}")"
          if [ -z "${oid}" ]; then
            echo "${response}" >&2
            exit 1
          fi
          echo "pushed ${oid}"
