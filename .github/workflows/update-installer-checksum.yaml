# Renovate bumps HERMETIC_VERSION in ./limen-install but cannot recompute
# its sha256 companion, the digest of that release's checksums.txt; this
# pushes the fix-up onto renovate/**
# (the canonical update-aqua-checksum is limen-pinned, byte-for-byte, and
# cannot carry it). Same construction as that workflow: `push:` on the
# branch prefix, never pull_request_target; no credential kept by the
# checkout; the commit made through createCommitOnBranch with the run's own
# token, which GitHub signs — the `limen:main` ruleset requires signatures,
# and an unsigned git push made every aqua-installer bump PR unmergeable —
# and the pull request's runs on the new head approved with the same token,
# since a push made with it starts none (book/tooling.md).
# No loop: the no-change exit ends recursion. Both fix-up workflows fire on
# renovate/** with disjoint writers; a grouped branch bumping both can
# collide — the loser fails, and Renovate's next rebase retriggers it.
name: update-installer-checksum

on:
  push:
    branches: ["renovate/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hermetic
      - run: hermetic install --only-link

      - name: Recompute the sha256 of hermetic's checksums.txt for the pinned version
        run: |
          version="$(sed -n 's/^readonly HERMETIC_VERSION="\(.*\)"$/\1/p' limen-install)"
          [ -n "$version" ] || { echo "could not extract HERMETIC_VERSION from ./limen-install" >&2; exit 1; }
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "${tmp}/checksums.txt" \
            "https://github.com/forkcloser/hermetic/releases/download/${version}/checksums.txt"
          sha="$(sha256sum "${tmp}/checksums.txt" | cut -d' ' -f1)"
          rm -rf "${tmp}"
          sed -i "s/^readonly HERMETIC_CHECKSUMS_SHA256=\".*\"$/readonly HERMETIC_CHECKSUMS_SHA256=\"${sha}\"/" limen-install

      - name: Commit the update through the API, if any
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          # The file this workflow owns, never the whole tree: setup-aqua and
          # the link step leave .hermetic/aqua-checksums.json rewritten on a
          # registry bump, and a whole-tree guard then committed this file
          # unchanged, whose push re-fired the workflow, every thirty seconds.
          git diff --quiet -- limen-install && { echo "installer checksum already in sync"; exit 0; }
          # One file, one writer: the recompute step above only ever edits
          # ./limen-install, so the payload is that file. createCommitOnBranch
          # carries no file mode, and the script's executable bit survives
          # because the mutation only replaces the blob of an existing path.
          # Signed-off-by: `just do lint commits` enforces DCO on the PR range,
          # bot commits included.
          payload="$(jq -n \
            --arg query 'mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg head "$(git rev-parse HEAD)" \
            --arg contents "$(base64 -w0 limen-install)" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $head,
              message: {
                headline: "chore: recompute the hermetic checksum",
                body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
              },
              fileChanges: {additions: [{path: "limen-install", contents: $contents}]}}}}')"
          # GraphQL reports failure in-body over HTTP 200, so success is the
          # presence of the new commit oid, never the HTTP status.
          # No --retry and no -L: a mutation guarded by expectedHeadOid, and a
          # redirect must never replay a POST (same as the canonical workflow).
          response="$(curl --proto '=https' --tlsv1.2 -fsS -X POST -H "Authorization: bearer ${TOKEN}" \
            -d "${payload}" https://api.github.com/graphql)"
          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"${response}")"
          if [ -z "${oid}" ]; then
            echo "${response}" >&2
            exit 1
          fi
          echo "pushed ${oid}"
          echo "oid=${oid}" >> "$GITHUB_OUTPUT"

      # A push made with the run's own token starts no workflow run, so the
      # pull request's checks on the new head are created awaiting approval
      # and approved here, as the canonical checksum workflow does. The runs
      # appear one workflow at a time, not together: the loop goes on
      # approving until thirty seconds pass with none new.
      - name: Approve the pull request's runs on the new head
        if: steps.commit.outputs.oid != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OID: ${{ steps.commit.outputs.oid }}
        run: |
          # The ids approved are kept: a run just approved can still read
          # action_required on the next listing, and a second approval fails.
          # A failed approval ends nothing: the run is tried again on the next
          # listing, and one the call approved despite its error is not
          # listed again. A rerun of this job skips the step (no new commit),
          # so an approval the step gives up on is never given.
          approved=""
          left=""
          quiet=0
          for _ in $(seq 1 18); do
            # The repository's newest runs, unfiltered, and the head picked
            # out here: GitHub's filtered listings can leave out a run that
            # awaits approval, and a run this step does not see is a check
            # that never reports (farcloser/limen, book/upstream.md). The
            # hundred newest are the step's whole view: a run of the head
            # that a hundred later ones pushed out of it, in the three
            # minutes the loop lives, is not seen either.
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.head_sha == env.OID) | select(.status == "action_required" or .conclusion == "action_required") | .id')" || runs=""
            new=""
            for id in $runs; do
              case " ${approved} " in
                *" ${id} "*) ;;
                *) new="${new} ${id}" ;;
              esac
            done
            left=""
            if [ -n "${new}" ]; then
              for id in ${new}; do
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null; then
                  echo "approved run ${id}"
                  approved="${approved} ${id}"
                else
                  echo "approval of run ${id} failed; tried again on the next listing"
                  left="${left} ${id}"
                fi
              done
              quiet=0
            elif [ -n "${approved}" ]; then
              quiet=$((quiet + 1))
              if [ "${quiet}" -ge 3 ]; then
                break
              fi
            fi
            sleep 10
          done
          if [ -z "${approved}" ]; then
            echo "::error::no run approved on ${OID} after three minutes: the pull request's checks will not report"
            exit 1
          fi
          if [ -n "${left}" ]; then
            echo "::error::run(s)${left} on ${OID} still awaiting approval after three minutes: their checks will not report"
            exit 1
          fi
